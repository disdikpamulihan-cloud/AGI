name: Singularity AGI 24/5 Profit Bot

on:
  # Tombol manual di tab Actions GitHub
  workflow_dispatch:
  
  # Otomatis berjalan setiap jam, aktif Senin sampai Jumat (Format Cron UTC)
  # Senin (1) sampai Jumat (5)
  schedule:
    - cron: '0 * * * 1-5'

jobs:
  trade-execution:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout AGI Core Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute AGI Autonomous Profit Loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
