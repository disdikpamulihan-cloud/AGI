name: XAUUSD V5 MAX ANTI BLOKIR

on:
  schedule:
    - cron: '*/5 * * * 1-5'  # Senin-Jumat tiap 5 menit
  workflow_dispatch:

# Anti blokir: jangan numpuk job kalo yang lama belum selesai
concurrency:
  group: xau-v5max
  cancel-in-progress: true

jobs:
  v5max:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Wajib short-lived, GitHub gak suka lama
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Cepat, gak perlu full history
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install deps (NO websocket = Anti Blokir)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests numpy scikit-learn aiohttp
          # Sengaja GAK install websockets -> biar 100% REST, GitHub aman
      
      - name: Run V5 MAX - 4.5 menit high-freq
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTIONS: true
          PYTHONUNBUFFERED: 1
        run: |
          echo "Starting V5 MAX at $(date -u)"
          timeout 270 python singularity_v5_max_final.py || echo "V5 MAX finished or timeout 270s (normal)"
          echo "Ended at $(date -u)"
      
      - name: Cleanup (biar gak ninggalin jejak IP)
        if: always()
        run: |
          rm -rf __pycache__ .pytest_cache
          echo "Clean done"
