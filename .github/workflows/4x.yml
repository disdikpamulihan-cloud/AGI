name: APEX-QUANT-4X Signal Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TZ: UTC
  ACCOUNT_BALANCE: "10000.0"
  RISK_PERCENT: "1.0"
  SQLITE_DB_PATH: "trading_signals.db"
  BACKTEST_CHART_PATH: "backtest_performance.png"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  run-signal-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run APEX-QUANT-4X signal bot
        run: python -u bot.py

      - name: Upload backtest chart artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-4x-backtest-chart
          path: backtest_performance.png
          if-no-files-found: ignore

      - name: Persist SQLite state and chart to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f trading_signals.db backtest_performance.png 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: persist SQLite signal state & backtest chart [skip ci]"
            git pull --rebase --autostash origin HEAD || true
            git push origin HEAD
          fi
